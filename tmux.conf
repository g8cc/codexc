# ~/.tmux.conf
# AI coding CLI（codex）在 tmux 下的键盘/鼠标修复
# 参考：tmux 手册 extended-keys / terminal-features；Pi 官方 tmux 配置文档
# 说明：Claude Code 相关配置（allow-passthrough 通知穿透等）暂未加入

# 让 tmux 区分 Shift+Enter 与 Enter（codex 输入框：Shift+Enter 换行 vs Enter 发送）
set -s extended-keys on

# 修饰键用 CSI-u 格式上报（tmux 3.5+；Pi 官方推荐的最可靠格式）
set -s extended-keys-format csi-u

# 声明外层终端（iTerm2，TERM=xterm-256color）支持扩展键，tmux 才会去协商
set -as terminal-features 'xterm*:extkeys'

# 鼠标：滚轮滚动 pane 历史（不再变成方向键喂给 codex）、鼠标点击切换 pane
set -g mouse on

# 加大 pane 历史，滚轮能滚更多内容
set -g history-limit 5000

# 前缀键改为 Ctrl+a（Ctrl+b 别扭），detach = C-a 再按 d
# 想给 shell 发真正的 Ctrl+a（跳行首）时，按两下 C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix
