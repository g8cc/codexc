# ~/.tmux.conf
# Keyboard/mouse fixes for AI coding CLIs (codex) under tmux
# Refs: tmux man pages for extended-keys / terminal-features
# Note: Claude-Code-specific settings (allow-passthrough etc.) intentionally omitted

# Let tmux distinguish Shift+Enter from Enter (codex composer: Shift+Enter = newline, Enter = send)
set -s extended-keys on

# Report modifier keys in CSI-u format (tmux >= 3.5; most reliable format)
set -s extended-keys-format csi-u

# Declare that the outer terminal (TERM=xterm-256color) supports extended keys so tmux negotiates them
set -as terminal-features 'xterm*:extkeys'

# Mouse: wheel scrolls pane history (instead of arrow keys fed to codex); click to switch panes
set -g mouse on

# Bigger pane scrollback
set -g history-limit 5000

# Prefix keys: Ctrl+a (primary) and Ctrl+b (legacy habit); detach = C-a d or C-b d
# Double-press the prefix (C-a C-a / C-b C-b) to send the real control char to the program
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
# tmux's prefix2 table is empty by default; sync the prefix table into it or C-b d does nothing
run-shell -b "$HOME/.codex/bin/sync-prefix2.sh"
